name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$HOME/.claude" && ./install.sh --dry-run
        env:
          HOME: ${{ runner.temp }}/home
      # A second repo with the same layout, installed by path, the way the private repo is. A folder
      # of the user's own and a link into another repo there are left alone, dry or real. A link into
      # this repo whose skill folder is gone is removed, on the real run only.
      - run: |
          mkdir -p "$RUNNER_TEMP/other/demo" "$RUNNER_TEMP/other/gone" "$RUNNER_TEMP/elsewhere/theirs" "$HOME/.claude/skills/mine"
          printf -- '---\nname: demo\ndescription: test\n---\n' > "$RUNNER_TEMP/other/demo/SKILL.md"
          touch "$RUNNER_TEMP/other/AGENTS.md"
          ln -s "$RUNNER_TEMP/elsewhere/theirs" "$HOME/.claude/skills/theirs"
          ln -s "$RUNNER_TEMP/other/gone" "$HOME/.claude/skills/gone" && rmdir "$RUNNER_TEMP/other/gone"
          ./install.sh --dry-run "$RUNNER_TEMP/other" | tee "$RUNNER_TEMP/out"
          # One assertion per line: bash -e ignores a failure on the left of &&.
          grep -q 'claude/skills/demo' "$RUNNER_TEMP/out"
          grep -q 'claude/AGENTS.md' "$RUNNER_TEMP/out"
          grep -q 'remove .*claude/skills/gone' "$RUNNER_TEMP/out"
          [[ -L $HOME/.claude/skills/gone ]]
          if grep -q -e 'skills/mine' -e 'skills/theirs' "$RUNNER_TEMP/out"; then exit 1; fi
          ./install.sh "$RUNNER_TEMP/other"
          [[ -L $HOME/.claude/skills/demo && -d $HOME/.claude/skills/mine && -L $HOME/.claude/skills/theirs ]]
          [[ ! -L $HOME/.claude/skills/gone ]]
        env:
          HOME: ${{ runner.temp }}/home
      # A repo with no skills yet installs nothing and lints clean, instead of tripping on the glob.
      - run: |
          mkdir -p "$RUNNER_TEMP/noskills"
          ./install.sh --dry-run "$RUNNER_TEMP/noskills" && ./check-skills.sh "$RUNNER_TEMP/noskills"
        env:
          HOME: ${{ runner.temp }}/home
      - run: ./check-skills.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
      - run: sudo apt-get install -y shellcheck && shellcheck install.sh check-skills.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force "$HOME\.claude" | Out-Null
        shell: pwsh
      # The README's own command line, so Windows PowerShell 5.1 parses the script as users run it.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun
        shell: pwsh
      # As on Linux: a folder of the user's own and a junction into another repo are left alone, dry or
      # real, and a junction into this repo whose skill folder is gone is removed on the real run.
      - run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\other\demo", "$env:RUNNER_TEMP\other\gone", "$env:RUNNER_TEMP\elsewhere\theirs", "$HOME\.claude\skills\mine" | Out-Null
          Set-Content "$env:RUNNER_TEMP\other\demo\SKILL.md" "---`nname: demo`ndescription: test`n---"
          New-Item -ItemType File -Force "$env:RUNNER_TEMP\other\AGENTS.md" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.claude\skills\theirs" -Target "$env:RUNNER_TEMP\elsewhere\theirs" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.claude\skills\gone" -Target "$env:RUNNER_TEMP\other\gone" | Out-Null
          Remove-Item "$env:RUNNER_TEMP\other\gone"
          $s = "$HOME\.claude\skills"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 "$env:RUNNER_TEMP\other" -DryRun | Out-String -Width 4096
          $out
          if ($out -notmatch 'claude\\skills\\demo' -or $out -notmatch 'claude\\AGENTS.md') { exit 1 }
          if ($out -notmatch 'remove .*skills\\gone' -or -not (Test-Path "$s\gone")) { exit 1 }
          if ($out -match 'skills\\(mine|theirs)') { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 "$env:RUNNER_TEMP\other"
          if (-not (Test-Path "$s\demo") -or -not (Test-Path "$s\mine") -or -not (Test-Path "$s\theirs")) { exit 1 }
          if (Test-Path "$s\gone") { exit 1 }
        shell: pwsh
