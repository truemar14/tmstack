name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: speak-mod
      - run: mkdir -p "$HOME/.claude" && ./install.sh --dry-run
        env:
          HOME: ${{ runner.temp }}/home
      - run: sudo apt-get install -y shellcheck && shellcheck install.sh
