name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: speak-mod
      # The typecheck needs declarations only an interactive /plugin-types writes, so CI validates
      # the plugin instead: the manifest, the hooks file, and that every hook module parses.
      - run: npx -y @anthropic-ai/claude-code plugin validate speak-mod
      # The marketplace, and the tmstack plugin's skills at the repo root.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      # The hooks against the engine itself: tests/engine/*.test.tsx.
      - run: npx -y @anthropic-ai/claude-code plugin test speak-mod
      - run: mkdir -p "$HOME/.claude" "$HOME/.codex" && ./install.sh --dry-run
        env:
          HOME: ${{ runner.temp }}/home
      # A second repo with the same layout, installed by path, the way the private repo is. Its skill
      # goes to the current Codex root, and an earlier run's link in the deprecated one is removed.
      # A folder of the user's own and a link into another repo there are left alone, dry or real.
      - run: |
          mkdir -p "$RUNNER_TEMP/other/demo" "$RUNNER_TEMP/elsewhere/theirs" "$HOME/.codex/skills/mine"
          printf -- '---\nname: demo\ndescription: test\n---\n' > "$RUNNER_TEMP/other/demo/SKILL.md"
          touch "$RUNNER_TEMP/other/AGENTS.md"
          ln -s "$RUNNER_TEMP/other/demo" "$HOME/.codex/skills/demo"
          ln -s "$RUNNER_TEMP/elsewhere/theirs" "$HOME/.codex/skills/theirs"
          ./install.sh --dry-run "$RUNNER_TEMP/other" | tee "$RUNNER_TEMP/out"
          grep -q 'agents/skills/demo' "$RUNNER_TEMP/out" && grep -q 'codex/AGENTS.md' "$RUNNER_TEMP/out"
          grep -q 'remove .*codex/skills/demo' "$RUNNER_TEMP/out"
          if grep -q -e 'skills/mine' -e 'skills/theirs' "$RUNNER_TEMP/out"; then exit 1; fi
          ./install.sh "$RUNNER_TEMP/other"
          [[ ! -e $HOME/.codex/skills/demo && -d $HOME/.codex/skills/mine && -L $HOME/.codex/skills/theirs ]]
          [[ -L $HOME/.agents/skills/demo ]]
        env:
          HOME: ${{ runner.temp }}/home
      - run: ./check-skills.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
      - run: sudo apt-get install -y shellcheck && shellcheck install.sh check-skills.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force "$HOME\.claude", "$HOME\.codex" | Out-Null
        shell: pwsh
      # The README's own command line, so Windows PowerShell 5.1 parses the script as users run it.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun
        shell: pwsh
      # As on Linux: only the link into the installed repo leaves ~/.codex/skills, dry or real.
      - run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\other\demo", "$env:RUNNER_TEMP\elsewhere\theirs", "$HOME\.codex\skills\mine" | Out-Null
          Set-Content "$env:RUNNER_TEMP\other\demo\SKILL.md" "---`nname: demo`ndescription: test`n---"
          New-Item -ItemType File -Force "$env:RUNNER_TEMP\other\AGENTS.md" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.codex\skills\demo" -Target "$env:RUNNER_TEMP\other\demo" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.codex\skills\theirs" -Target "$env:RUNNER_TEMP\elsewhere\theirs" | Out-Null
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 "$env:RUNNER_TEMP\other" -DryRun | Out-String -Width 4096
          $out
          if ($out -notmatch 'agents\\skills\\demo' -or $out -notmatch 'codex\\AGENTS.md') { exit 1 }
          if ($out -notmatch 'remove .*codex\\skills\\demo') { exit 1 }
          if ($out -match 'skills\\(mine|theirs)') { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 "$env:RUNNER_TEMP\other"
          $s = "$HOME\.codex\skills"
          if ((Test-Path "$s\demo") -or -not (Test-Path "$s\mine") -or -not (Test-Path "$s\theirs")) { exit 1 }
          if (-not (Test-Path "$HOME\.agents\skills\demo")) { exit 1 }
        shell: pwsh
